<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Getaway Shootout - Diagnostic</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#777}
#game{position:fixed;inset:0;width:100%;height:100%}#game canvas{width:100%;height:100%;display:block;outline:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:white;font:16px Arial;background:#000;z-index:2}
#barOuter{width:min(70vw,360px);height:10px;border:1px solid #888;border-radius:20px;overflow:hidden}#bar{width:0;height:100%;background:#fff}
#logButton{position:fixed;right:8px;top:8px;z-index:20;background:#111;color:#fff;border:1px solid #aaa;border-radius:6px;padding:8px 11px;font:13px Arial}
#errorLog{display:none;position:fixed;left:8px;right:8px;top:48px;bottom:8px;max-height:70vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(0,0,0,.94);color:#fff;border:1px solid #aaa;padding:10px;font:11px/1.4 monospace;z-index:19;pointer-events:auto}
</style>
</head>
<body>
<div id="game"><canvas id="game-canvas" tabindex="-1"></canvas></div>
<div id="loading"><div>Loading Getaway Shootout diagnostic...</div><div id="barOuter"><div id="bar"></div></div></div>
<button id="logButton" type="button">Show log (0)</button><pre id="errorLog"></pre>
<script>
(function(){
const loading=document.getElementById("loading"),bar=document.getElementById("bar"),errorLog=document.getElementById("errorLog"),logButton=document.getElementById("logButton");
let lines=[];
function log(label,detail){
 const value=typeof detail==="string"?detail:(detail&&detail.stack)||String(detail??"");
 const line="["+new Date().toLocaleTimeString()+"] "+label+": "+value;
 lines.push(line);if(lines.length>100)lines.shift();
 errorLog.textContent=lines.join("\n");logButton.textContent="Show log ("+lines.length+")";
 console.log(line);
}
// Capture failed requests that may only happen when a level loads.
const originalFetch=window.fetch;
if(originalFetch) window.fetch=function(){const args=arguments;return originalFetch.apply(this,args).then(response=>{if(!response.ok)log("Fetch failed",response.status+" "+response.url);return response;}).catch(err=>{log("Fetch error",err);throw err;});};
const originalOpen=XMLHttpRequest.prototype.open,originalSend=XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.open=function(method,url){this.__diagUrl=url;return originalOpen.apply(this,arguments);};
XMLHttpRequest.prototype.send=function(){this.addEventListener("load",function(){if(this.status>=400||this.status===0)log("XHR failed",this.status+" "+this.__diagUrl);});this.addEventListener("error",()=>log("XHR error",this.__diagUrl));return originalSend.apply(this,arguments);};
window.addEventListener("error",e=>{if(e.target&&e.target!==window)log("Resource failed",e.target.src||e.target.href||e.target.tagName);},true);
const originalConsoleError=console.error;
console.error=function(){log("Console error",Array.from(arguments).join(" "));return originalConsoleError.apply(console,arguments);};
logButton.addEventListener("click",()=>{const open=errorLog.style.display==="block";errorLog.style.display=open?"none":"block";logButton.textContent=(open?"Show":"Hide")+" log ("+lines.length+")";});
window.addEventListener("error",e=>log("Browser error",e.message+" ("+e.filename+":"+e.lineno+")"));
window.addEventListener("unhandledrejection",e=>log("Promise rejection",e.reason));
const canvas=document.getElementById("game-canvas");
canvas.addEventListener("webglcontextlost",e=>{e.preventDefault();log("WebGL context lost","Graphics context was lost.");});
const files=["Build/loader-v2.js","Build/864872d3e8c17c58e54028c101dae7a5.data.br","Build/frame.js","Build/c0f8b2f06ae4c7c89b1e883b3d07ca8f.wasm.wasm"];
const script=document.createElement("script");script.src=files[0];
script.onerror=()=>log("Loader error","Could not load "+script.src);
script.onload=()=>{
 const config={
 dataUrl:files[1],frameworkUrl:files[2],codeUrl:files[3],
 streamingAssetsUrl:"https://fablesend1.github.io/Getaway-shootout/StreamingAssets/",
 companyName:"Game",productName:"Getaway Shootout",productVersion:"1.2.3",
 print:m=>log("Unity log",m),
 printErr:m=>log("Unity error",m),
 showBanner:(m,t)=>log("Unity "+t,m)
 };
 log("Startup","Unity loader loaded. Starting game.");
 createUnityInstance(canvas,config,p=>{bar.style.width=(100*p)+"%";}).then(instance=>{
 window.unityInstance=instance;loading.style.display="none";log("Startup","Unity instance started successfully.");
 }).catch(e=>{log("Startup failed",e);loading.style.display="none";});
};
document.body.appendChild(script);
})();
</script>
</body>
</html>
