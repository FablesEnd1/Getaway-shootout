<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Getaway Shootout</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; }
    #game canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: white; font: 16px Arial, sans-serif; background: #000; }
    #barOuter { width: min( min(70vw, 360px), 85vw); height: 10px; border: 1px solid #888; border-radius: 20px; overflow: hidden; }
    #bar { width: 0%; height: 100%; background: #fff; }
    #error { display: none; position: fixed; left: 5%; right: 5%; bottom: 5%; padding: 12px; color: white; background: #7b1111; font: 14px Arial, sans-serif; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="game"><canvas id="game-canvas" tabindex="-1"></canvas></div>
  <div id="loading">
    <div>Loading Getaway Shootout...</div>
    <div id="barOuter"><div id="bar"></div></div>
  </div>
  <div id="error"></div>

  <script src="Build/GS_Crazygames_v1.2.3.loader.js"></script>
  <script>
    const canvas = document.getElementById("game-canvas");
    const loading = document.getElementById("loading");
    const bar = document.getElementById("bar");
    const errorBox = document.getElementById("error");

    function showError(message) {
      errorBox.style.display = "block";
      errorBox.textContent = "Game failed to start: " + message;
      loading.style.display = "none";
    }

    const config = {
      dataUrl: "Build/864872d3e8c17c58e54028c101dae7a5.data.br",
      frameworkUrl: "Build/dbc6f14bf976310a49dda5b1237392f2.js.js",
      codeUrl: "Build/c0f8b2f06ae4c7c89b1e883b3d07ca8f.wasm.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Game",
      productName: "Getaway Shootout",
      productVersion: "1.2.3",
      showBanner: function (message, type) {
        if (type === "error") showError(message);
        else console.warn(message);
      }
    };

    createUnityInstance(canvas, config, function (progress) {
      bar.style.width = (100 * progress) + "%";
    }).then(function (instance) {
      loading.style.display = "none";
      window.unityInstance = instance;
    }).catch(showError);
  </script>
</body>
</html>
