<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Getaway Shootout</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#777}
#game{position:fixed;inset:0;width:100%;height:100%}
#game canvas{width:100%;height:100%;display:block;outline:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:white;font:16px Arial;background:#000;z-index:2}
#barOuter{width:min(70vw,360px);height:10px;border:1px solid #888;border-radius:20px;overflow:hidden}
#bar{width:0;height:100%;background:#fff}
#errorLog{display:none;position:fixed;left:8px;right:8px;bottom:8px;max-height:34vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(0,0,0,.92);color:#ffb3b3;border:1px solid #a44;padding:10px;font:12px/1.4 monospace;z-index:10}
</style>
</head>
<body>
<div id="game"><canvas id="game-canvas" tabindex="-1"></canvas></div>
<div id="loading"><div>Loading Getaway Shootout...</div><div id="barOuter"><div id="bar"></div></div></div>\n<pre id="errorLog"></pre>
<script>
(function(){
const loading=document.getElementById("loading"),bar=document.getElementById("bar");
window.addEventListener("error",e=>console.error("Game error:",e.message,e.filename,e.lineno));
window.addEventListener("unhandledrejection",e=>console.error("Game promise error:",e.reason));
const files=[
["loader","Build/loader-v2.js"],
["data","Build/864872d3e8c17c58e54028c101dae7a5.data.br"],
["framework","Build/frame.js"],
["wasm","Build/c0f8b2f06ae4c7c89b1e883b3d07ca8f.wasm.wasm"],
["music","StreamingAssets/Music.aac"]
];
const canvas=document.getElementById("game-canvas");
const script=document.createElement("script");script.src=files[0][1];
script.onerror=()=>reportError("Loader error","Could not load "+script.src);
script.onload=()=>{
const config={
dataUrl:files[1][1],
frameworkUrl:files[2][1],
codeUrl:files[3][1],
streamingAssetsUrl:"StreamingAssets",
companyName:"Game",
productName:"Getaway Shootout",
productVersion:"1.2.3",
print:m=>console.log(m),
printErr:m=>console.error(m),
showBanner:(m,t)=>{(t==="error"?console.error:console.warn)(m)}
};
createUnityInstance(canvas,config,p=>{bar.style.width=(100*p)+"%";}).then(instance=>{
window.unityInstance=instance;loading.style.display="none";
}).catch(e=>{reportError("Unity startup failed",e);loading.style.display="none";});
};
document.body.appendChild(script);
})();
</script>
</body>
</html>
